<script>
/* Bootstrap — tegn Om oss fra data FØR membership.js og app.js, slik at
   #joinTiers/#joinSteps og .reveal/.faq__q finnes når de kobler seg på. */
(function () {
  'use strict';
  var IS_PREVIEW = false;
  try { IS_PREVIEW = /[?&]preview\b/.test(location.search); } catch (e) {}
  var mount = document.getElementById('page');

  function draw() {
    if (!window.PageEngine || !window.OM_PAGE || !mount) return;
    window.PageEngine.render(window.OM_PAGE, mount, { preview: IS_PREVIEW });
    if (IS_PREVIEW) {
      document.querySelectorAll('.reveal').forEach(function (el) { el.classList.add('in'); });
    }
  }
  draw();

  /* Live forhåndsvisning — presise oppdateringer:
       apeiron-page-preview  → full tegning (struktur: legg til/fjern/sorter)
       apeiron-page-tone     → bare oppdater data-tone (fargebytte, ingen ombygging)
       apeiron-section-update→ tegn KUN én seksjon om (tekstredigering) */
  if (IS_PREVIEW) {
    var notify = function () {
      try { parent.postMessage({ type: 'apeiron-om-preview-height', height: document.documentElement.scrollHeight }, '*'); } catch (e) {}
    };
    var reveal = function () { document.querySelectorAll('.reveal').forEach(function (el) { el.classList.add('in'); }); };
    var fillMembership = function () { if (window.renderMembership) { try { window.renderMembership(); } catch (_) {} } };
    window.addEventListener('message', function (e) {
      if (e.origin !== window.location.origin) return;
      var d = e.data; if (!d) return;
      if (d.type === 'apeiron-page-preview') {
        if (d.page) window.OM_PAGE = d.page;
        draw(); fillMembership(); notify();
      } else if (d.type === 'apeiron-page-tone') {
        if (d.page) window.OM_PAGE = d.page;
        if (window.PageEngine && window.OM_PAGE) window.PageEngine.applyTones(window.OM_PAGE, mount, { preview: true });
        notify();
      } else if (d.type === 'apeiron-section-update') {
        if (d.page) window.OM_PAGE = d.page;
        if (window.PageEngine && window.OM_PAGE && d.id) window.PageEngine.renderSection(window.OM_PAGE, mount, d.id, { preview: true });
        reveal(); fillMembership(); notify();
      }
    });
    try { parent.postMessage({ type: 'apeiron-om-preview-ready' }, '*'); } catch (e) {}
    notify();
  }
})();
</script>
