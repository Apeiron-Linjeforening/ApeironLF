<style>
/* ── Subpage header ── */
.subhero {
  background:
    radial-gradient(100% 80% at 90% 0%, rgba(212,175,55,.12), transparent 55%),
    radial-gradient(70% 60% at 5% 100%, rgba(118,17,15,.28), transparent 60%),
    var(--navy);
  color: var(--paper);
  padding: 148px 0 72px;
  position: relative;
  overflow: hidden;
}
.subhero__seal {
  position: absolute; right: -4%; top: 50%; transform: translateY(-50%);
  width: min(44vw, 540px); opacity: .09; pointer-events: none; z-index: 1;
  filter: drop-shadow(0 0 1px rgba(212,175,55,.4));
}
.subhero::after {
  content: ""; position: absolute; inset: 0; z-index: 0; pointer-events: none;
  background-image: radial-gradient(70% 50% at 50% -10%, rgba(212,175,55,.07), transparent 70%);
  opacity: .7;
}
.subhero__inner { position: relative; z-index: 2; max-width: var(--maxw); margin: 0 auto; padding: 0 28px; }
.subhero h1 {
  color: var(--paper);
  font-size: clamp(3rem, 8vw, 6.5rem);
  line-height: .95; letter-spacing: .01em; margin: .22em 0 .35em;
}
.subhero__lede { font-size: 1.18rem; color: rgba(244,236,217,.8); max-width: 56ch; line-height: 1.65; }
.subhero__back {
  display: flex; width: fit-content; align-items: center; gap: .5em;
  font-size: .82rem; font-weight: 600; letter-spacing: .14em; text-transform: uppercase;
  color: rgba(244,236,217,.55); margin-bottom: .6em; transition: color .2s;
}
.subhero__back:hover { color: var(--gold); }
.subhero__back::before { content: "←"; font-style: normal; }

/* ── Award grid ── */
.award-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
  gap: 26px;
  margin-top: 2.6em;
}
.award-card {
  background: var(--card, #f7f3ec);
  border: 1px solid var(--line);
  border-left: 4px solid var(--c-l, var(--gold));
  border-radius: 6px; overflow: hidden;
  display: flex; flex-direction: column;
  transition: transform .22s ease, box-shadow .25s ease;
}
html[data-mode="marine"] .award-card { border-left-color: var(--c-d, var(--gold)); }
.award-card:hover { transform: translateY(-4px); box-shadow: 0 24px 48px -28px rgba(35,39,64,.55); }

.award-card__img {
  position: relative; width: 100%; aspect-ratio: 16 / 10;
  background: var(--navy); border-bottom: 1px solid var(--line);
}
.award-card__img img { width: 100%; height: 100%; display: block; object-fit: cover; }
.award-card__img-fallback {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  font-family: var(--display); font-size: 2.6rem; color: rgba(212,175,55,.4); pointer-events: none;
}
.award-card__img:has(img) .award-card__img-fallback { display: none; }

.award-card__medal {
  position: absolute; top: 12px; left: 12px; z-index: 3;
  font-family: var(--body); font-size: .64rem; font-weight: 700;
  letter-spacing: .16em; text-transform: uppercase;
  color: var(--on-dark); background: var(--c-l, var(--gold-ink));
  border-radius: 999px; padding: .5em 1em;
  box-shadow: 0 4px 14px -4px rgba(0,0,0,.5);
}

.award-card__body { padding: 22px 24px 24px; display: flex; flex-direction: column; gap: 8px; }
.award-card h3 { font-family: var(--display); font-size: 1.55rem; font-weight: 600; color: var(--ink); line-height: 1.1; margin: 0; }
.award-card__meta {
  font-family: var(--body); font-size: .72rem; font-weight: 700;
  letter-spacing: .16em; text-transform: uppercase; color: var(--accent-ink, var(--gold-ink));
  display: flex; align-items: center; gap: .6em; flex-wrap: wrap;
}
.award-card__meta span { opacity: .4; }
.award-card p { font-size: .96rem; color: var(--ink-soft, #4a4d6a); line-height: 1.62; margin: 4px 0 0; }

.award-empty {
  grid-column: 1 / -1; text-align: center; padding: 60px 20px;
  color: var(--ink-soft); font-style: italic; font-size: 1.05rem;
}

@media (max-width: 600px) { .award-grid { grid-template-columns: 1fr; } }
</style>

<script>
/* ── Render oppnåelser fra oppnaelser-content.js ── */
(function () {
  var IS_PREVIEW = false;
  try { IS_PREVIEW = /[?&]preview\b/.test(location.search); } catch (e) {}
  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function setText(id, val) {
    var el = document.getElementById(id);
    if (!el) return;
    if (IS_PREVIEW) { el.textContent = (val == null ? '' : val); return; }
    if (val != null && val !== '') el.textContent = val;
  }
  var STAGGER = ['', 'd1', 'd2', 'd3'];

  function renderOppnaelser() {
    var C = window.OPPNAELSER_CONTENT || {};
    if (C.intro) {
      setText('intro-eyebrow', C.intro.eyebrow);
      setText('intro-heading', C.intro.heading);
      setText('intro-lede', C.intro.lede);
      var bk = document.getElementById('intro-back');
      if (bk) {
        if (IS_PREVIEW) bk.textContent = (C.intro.back == null ? '' : C.intro.back);
        else if (C.intro.back) bk.textContent = C.intro.back;
        if (C.intro.backHref) bk.setAttribute('href', C.intro.backHref);
      }
    }
    var grid = document.getElementById('award-grid');
    if (!grid || !Array.isArray(C.awards)) return;
    if (!C.awards.length) {
      grid.innerHTML = '<p class="award-empty">Ingen oppnåelser er lagt til ennå.</p>';
      return;
    }
    var sv = window.paletteStyleVars || function () { return ''; };
    grid.innerHTML = C.awards.map(function (a, i) {
      var accentStyle = a.accent ? sv(a.accent) : '';
      var medal = a.medal ? '<div class="award-card__medal">' + esc(a.medal) + '</div>' : '';
      var fallback = (a.title || '?').trim().charAt(0).toUpperCase();
      var metaParts = [];
      if (a.giver) metaParts.push(esc(a.giver));
      if (a.year) metaParts.push(esc(a.year));
      var meta = metaParts.length
        ? '<div class="award-card__meta">' + metaParts.join('<span>·</span>') + '</div>' : '';
      var desc = a.desc ? '<p>' + esc(a.desc) + '</p>' : '';
      return '<div class="award-card reveal ' + STAGGER[i % 4] + '" style="' + accentStyle + '">'
        + '<div class="award-card__img">' + medal
        + '<span class="award-card__img-fallback">' + esc(fallback) + '</span>'
        + (a.img ? '<img src="' + esc(a.img) + '" alt="' + esc(a.title || '') + '" loading="lazy">' : '') + '</div>'
        + '<div class="award-card__body">'
        + '<h3>' + esc(a.title) + '</h3>'
        + meta
        + desc
        + '</div>'
        + '</div>';
    }).join('');
  }

  renderOppnaelser();

  /* ── Live forhåndsvisning fra admin (oppnaelser.html?preview=1) ── */
  if (IS_PREVIEW) {
    var pvNotify = function () {
      try { parent.postMessage({ type: 'apeiron-oppnaelser-preview-height', height: document.documentElement.scrollHeight }, '*'); } catch (e) {}
    };
    window.addEventListener('message', function (e) {
      if (e.origin !== window.location.origin) return;
      var d = e.data;
      if (!d || d.type !== 'apeiron-oppnaelser-preview') return;
      if (d.content) window.OPPNAELSER_CONTENT = d.content;
      renderOppnaelser();
      document.querySelectorAll('.reveal').forEach(function (el) { el.classList.add('in'); });
      pvNotify();
    });
    document.querySelectorAll('.reveal').forEach(function (el) { el.classList.add('in'); });
    try { parent.postMessage({ type: 'apeiron-oppnaelser-preview-ready' }, '*'); } catch (e) {}
  }
})();
</script>
<script>
(function () {
  var reveals = document.querySelectorAll('.reveal');
  if ('IntersectionObserver' in window) {
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (e) {
        if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); }
      });
    }, { threshold: 0.1 });
    reveals.forEach(function (el) { io.observe(el); });
  } else {
    reveals.forEach(function (el) { el.classList.add('in'); });
  }
})();
</script>
