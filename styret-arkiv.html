<style>
/* Felles .subhero-stil ligger i styles.css — under: kun denne sidens avvik */

.subhero__lede { font-size: 1.18rem; color: rgba(244,236,217,.8); max-width: 54ch; line-height: 1.65; }

/* ── Arkiv ── */
.arch-empty {
  max-width: 52ch; margin: 0 auto; text-align: center;
  color: var(--ink-soft, #4a4d6a); font-size: 1.05rem; line-height: 1.7;
}

/* ── Periode-filter ── */
.arch-filter { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-bottom: 34px; }
.arch-filter[hidden] { display: none; }
.arch-filter__label {
  font-family: var(--body); font-size: .7rem; font-weight: 700;
  letter-spacing: .24em; text-transform: uppercase; color: var(--accent-ink, var(--gold-ink));
}
.arch-filter__chips { display: flex; flex-wrap: wrap; gap: 10px; }
.arch-chip {
  font-family: var(--body); font-size: .84rem; font-weight: 600; letter-spacing: .03em;
  padding: .5em 1.15em; border-radius: 999px; cursor: pointer; color: var(--ink-soft);
  background: transparent; border: 1px solid var(--line);
  transition: color .18s, background .18s, border-color .18s, transform .18s;
}
.arch-chip:hover { color: var(--ink); border-color: var(--ink); transform: translateY(-1px); }
.arch-chip.is-active { background: var(--navy); color: var(--paper); border-color: var(--navy); }
html[data-mode="marine"] .arch-chip.is-active { background: var(--gold); color: var(--navy); border-color: var(--gold); }
/* tiår-chip (folder ut årene) + utfoldede år-chips */
.arch-chip--decade { display: inline-flex; align-items: center; gap: .45em; }
.arch-chip__caret { font-size: .68em; opacity: .55; transition: transform .18s; }
.arch-chip--decade.is-open .arch-chip__caret { transform: rotate(180deg); }
.arch-chip--decade.is-open { color: var(--ink); border-color: var(--ink); }
.arch-chip--decade.has-active { color: var(--ink); border-color: var(--navy); }
.arch-chip--year { background: color-mix(in srgb, var(--navy) 6%, transparent); border-color: transparent; }
.arch-chip--year:hover { background: color-mix(in srgb, var(--navy) 13%, transparent); border-color: transparent; transform: translateY(-1px); }
.arch-chip--year.is-active { background: var(--navy); color: var(--paper); border-color: var(--navy); }
html[data-mode="marine"] .arch-chip--year.is-active { background: var(--gold); color: var(--navy); border-color: var(--gold); }
.arch-list { display: flex; flex-direction: column; gap: 0; }
.arch-board { padding: 64px 0; border-top: 1px solid var(--line); }
.arch-board:first-child { border-top: none; padding-top: 8px; }
.arch-board__head { max-width: 64ch; margin-bottom: 36px; }
.arch-board__period {
  font-family: var(--body); font-size: .72rem; font-weight: 700;
  letter-spacing: .26em; text-transform: uppercase;
  color: var(--accent-ink, var(--navy)); opacity: .6;
}
.arch-board__title {
  font-family: var(--display); font-size: clamp(2rem, 4.5vw, 3.2rem);
  font-weight: 700; color: var(--ink); line-height: 1.02; margin: .12em 0 .35em;
}
.arch-board__summary { font-size: 1.08rem; color: var(--ink-soft, #4a4d6a); line-height: 1.7; }

.arch-board__body { display: grid; grid-template-columns: 1fr; gap: 30px; }
.arch-board__body.has-aside { grid-template-columns: minmax(0, 1fr) 300px; }
@media (max-width: 820px) { .arch-board__body.has-aside { grid-template-columns: 1fr; } }

.arch-highlights {
  align-self: start; background: var(--card, #f7f3ec);
  border: 1px solid var(--line); border-left: 4px solid var(--gold);
  border-radius: 4px; padding: 22px 24px;
}
html[data-mode="marine"] .arch-highlights { border-left-color: var(--gold); }
.arch-highlights h3 {
  font-family: var(--display); font-size: 1.25rem; font-weight: 600; color: var(--ink);
  margin: 0 0 12px;
}
.arch-highlights ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 9px; }
.arch-highlights li { position: relative; padding-left: 18px; font-size: .94rem; color: var(--ink); line-height: 1.55; }
.arch-highlights li::before { content: "–"; position: absolute; left: 0; color: var(--warm, var(--gold-ink, #a07820)); font-weight: 700; }

.arch-members {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
  gap: 22px;
}
.arch-member {
  background: var(--card, #f7f3ec); border: 1px solid var(--line);
  border-radius: 6px; padding: 22px 20px 20px;
  display: flex; flex-direction: column; align-items: center; text-align: center; gap: 4px;
}
.arch-member__ph {
  position: relative; width: 96px; height: 96px; border-radius: 50%;
  background: var(--navy); color: var(--paper);
  display: flex; align-items: center; justify-content: center; margin-bottom: 10px;
  overflow: hidden;
}
.arch-member__initials {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  font-family: var(--display); font-size: 1.5rem; font-weight: 700; letter-spacing: .04em; z-index: 0;
}
.arch-member__ph image-slot { position: relative; z-index: 1; width: 96px; height: 96px; }
.arch-member__img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; }
.arch-member__role {
  font-family: var(--body); font-size: .66rem; font-weight: 700;
  letter-spacing: .16em; text-transform: uppercase; color: var(--accent-ink, var(--navy)); opacity: .7;
}
.arch-member h3 { font-family: var(--display); font-size: 1.25rem; font-weight: 600; color: var(--ink); line-height: 1.1; margin: 0; }
.arch-member__note { font-size: .9rem; color: var(--ink-soft, #4a4d6a); line-height: 1.55; margin: 6px 0 0; }
.arch-member__tags { display: flex; flex-wrap: wrap; gap: 5px; justify-content: center; margin-top: 10px; }
.arch-member__tag {
  font-family: var(--body); font-size: .64rem; font-weight: 700; letter-spacing: .04em;
  padding: 2px 9px; border-radius: 999px;
  color: var(--c-l, #5a5d72);
  background: color-mix(in srgb, var(--c-l, #5a5d72) 12%, transparent);
  border: 1px solid color-mix(in srgb, var(--c-l, #5a5d72) 32%, transparent);
}
html[data-mode="marine"] .arch-member__tag {
  color: var(--c-d, #b3b8d2);
  background: color-mix(in srgb, var(--c-d, #b3b8d2) 16%, transparent);
  border-color: color-mix(in srgb, var(--c-d, #b3b8d2) 34%, transparent);
}

<script>
/* ── Render arkivet fra styret-content.js (archive[]) ── */
(function () {
  var IS_PREVIEW = false;
  try { IS_PREVIEW = /[?&]preview\b/.test(location.search); } catch (e) {}
  var PREVIEW_IMAGES = {};
  function resolveImg(src) { if (!src) return ''; return PREVIEW_IMAGES[src] || src; }
  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  var STAGGER = ['', 'd1', 'd2', 'd3'];
  var currentFilter = 'all';
  var expandedDecade = null;

  // Sorteringsnøkkel: første firesifrede årstall i perioden («2024 / 2025» → 2024).
  function yearKey(p) { var m = String(p == null ? '' : p).match(/\d{4}/); return m ? parseInt(m[0], 10) : -1; }

  // Distinkte perioder, nyeste først.
  function distinctPeriods(list) {
    var seen = {}, out = [];
    list.forEach(function (a) { var p = String((a && a.period) || '').trim(); if (p && !seen[p]) { seen[p] = 1; out.push(p); } });
    out.sort(function (a, b) { return yearKey(b) - yearKey(a); });
    return out;
  }

  // Stabil sortering etter periode (nyeste først), beholder admin-rekkefølge innen samme periode.
  function sortByPeriod(list) {
    return list.map(function (a, i) { return { a: a, i: i }; })
      .sort(function (x, y) { var d = yearKey(y.a.period) - yearKey(x.a.period); return d !== 0 ? d : x.i - y.i; })
      .map(function (o) { return o.a; });
  }

  var revealIO = ('IntersectionObserver' in window) ? new IntersectionObserver(function (entries) {
    entries.forEach(function (e) { if (e.isIntersecting) { e.target.classList.add('in'); revealIO.unobserve(e.target); } });
  }, { threshold: 0.08 }) : null;
  function observeBoards() {
    var els = document.querySelectorAll('.arch-board.reveal');
    if (!revealIO || IS_PREVIEW) { els.forEach(function (el) { el.classList.add('in'); }); return; }
    els.forEach(function (el) { if (!el.classList.contains('in')) revealIO.observe(el); });
  }

  function renderFilter(periods) {
    var fbar = document.getElementById('arch-filter');
    if (!fbar) return;
    if (periods.length < 2) { fbar.hidden = true; fbar.innerHTML = ''; currentFilter = 'all'; expandedDecade = null; return; }
    if (currentFilter !== 'all' && periods.indexOf(currentFilter) < 0) currentFilter = 'all';
    fbar.hidden = false;

    var newest = periods.slice(0, 2);   // de to nyeste årskullene — alltid synlige
    var rest = periods.slice(2);        // eldre — grupperes i tiår

    var decades = [], byKey = {};
    rest.forEach(function (p) {
      var d = decadeKey(p);
      if (!byKey[d]) { byKey[d] = { key: d, label: d + '-tallet', years: [] }; decades.push(byKey[d]); }
      byKey[d].years.push(p);
    });

    function yearChip(p, cls) {
      return '<button type="button" class="arch-chip' + (cls || '') + (currentFilter === p ? ' is-active' : '') + '" data-act="year" data-period="' + esc(p) + '">' + esc(p) + '</button>';
    }

    var html = '<span class="arch-filter__label">Vis periode</span><div class="arch-filter__chips">';
    html += '<button type="button" class="arch-chip' + (currentFilter === 'all' ? ' is-active' : '') + '" data-act="all">Alle</button>';
    newest.forEach(function (p) { html += yearChip(p, ''); });
    decades.forEach(function (dec) {
      if (dec.years.length === 1) { html += yearChip(dec.years[0], ''); return; }
      var open = expandedDecade === dec.key;
      var hasActive = currentFilter !== 'all' && dec.years.indexOf(currentFilter) >= 0;
      html += '<button type="button" class="arch-chip arch-chip--decade' + (open ? ' is-open' : '') + (hasActive && !open ? ' has-active' : '') + '" data-act="decade" data-decade="' + dec.key + '" aria-expanded="' + (open ? 'true' : 'false') + '">' + esc(dec.label) + '<span class="arch-chip__caret">▾</span></button>';
      if (open) dec.years.forEach(function (p) { html += yearChip(p, ' arch-chip--year'); });
    });
    html += '</div>';
    fbar.innerHTML = html;

    fbar.querySelectorAll('[data-act]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var act = btn.getAttribute('data-act');
        if (act === 'decade') {
          var d = parseInt(btn.getAttribute('data-decade'), 10);
          expandedDecade = (expandedDecade === d) ? null : d;
          renderFilter(periods);
          return;
        }
        selectPeriod(act === 'all' ? 'all' : btn.getAttribute('data-period'), periods);
      });
    });
  }

  function decadeKey(p) { var k = yearKey(p); return k < 0 ? -1 : Math.floor(k / 10) * 10; }

  function selectPeriod(val, periods) {
    if (val !== 'all') {
      var newest = periods.slice(0, 2), dk = decadeKey(val);
      if (newest.indexOf(val) < 0 && dk >= 0) expandedDecade = dk; // hold tiåret åpent så aktiv chip vises
    }
    if (val === currentFilter) return;
    currentFilter = val;
    render();
  }

  function memberHtml(m) {
    var src = resolveImg(m.img);
    var img = src
      ? '<img class="arch-member__img" src="' + esc(src) + '" alt="" loading="lazy" onerror="this.style.display=&quot;none&quot;">'
      : '';
    var sv = window.paletteStyleVars || function () { return ''; };
    var tags = (m.tags || []).filter(function (t) { return t && t.label; }).map(function (t) {
      return '<span class="arch-member__tag" style="' + sv(t.color) + '">' + esc(t.label) + '</span>';
    }).join('');
    return '<div class="arch-member">'
      + '<div class="arch-member__ph"><span class="arch-member__initials">' + esc(m.initials || '') + '</span>'
      + img + '</div>'
      + (m.role ? '<div class="arch-member__role">' + esc(m.role) + '</div>' : '')
      + '<h3>' + esc(m.name || '') + '</h3>'
      + (m.note ? '<p class="arch-member__note">' + esc(m.note) + '</p>' : '')
      + (tags ? '<div class="arch-member__tags">' + tags + '</div>' : '')
      + '</div>';
  }

  function boardHtml(a, i) {
    var members = (a.members || []).filter(function (m) { return m && (m.name || m.initials || m.img); });
    var highlights = (a.highlights || []).filter(function (x) { return x && String(x).trim(); });
    var title = a.heading || (a.period ? 'Styret ' + a.period : 'Tidligere styre');
    var aside = highlights.length
      ? '<aside class="arch-highlights"><h3>Høydepunkter</h3><ul>'
          + highlights.map(function (h) { return '<li>' + esc(h) + '</li>'; }).join('')
          + '</ul></aside>'
      : '';
    var membersHtml = members.length
      ? '<div class="arch-members">' + members.map(memberHtml).join('') + '</div>'
      : '';
    var body = (membersHtml || aside)
      ? '<div class="arch-board__body' + (aside && membersHtml ? ' has-aside' : '') + '">' + membersHtml + aside + '</div>'
      : '';
    return '<article class="arch-board reveal ' + STAGGER[i % 4] + '">'
      + '<header class="arch-board__head">'
        + (a.period ? '<div class="arch-board__period">' + esc(a.period) + '</div>' : '')
        + '<h2 class="arch-board__title">' + esc(title) + '</h2>'
        + (a.summary ? '<p class="arch-board__summary">' + esc(a.summary) + '</p>' : '')
      + '</header>'
      + body
      + '</article>';
  }

  function render() {
    var C = window.STYRET_CONTENT || {};
    var list = document.getElementById('arch-list');
    if (!list) return;
    var arch = (C.archive || []).filter(function (a) { return a && (a.period || a.heading || a.summary || (a.members && a.members.length)); });
    var fbar = document.getElementById('arch-filter');
    if (!arch.length) {
      if (fbar) { fbar.hidden = true; fbar.innerHTML = ''; }
      list.innerHTML = '<p class="arch-empty">Arkivet er tomt ennå. Når et styre trer av, legges det inn her, med en oppsummering av perioden og hva hvert medlem bidro med.</p>';
      return;
    }
    renderFilter(distinctPeriods(arch));
    var sorted = sortByPeriod(arch);
    var shown = (currentFilter === 'all') ? sorted : sorted.filter(function (a) { return String(a.period || '').trim() === currentFilter; });
    if (!shown.length) {
      list.innerHTML = '<p class="arch-empty">Ingen styrer i denne perioden.</p>';
      return;
    }
    list.innerHTML = shown.map(boardHtml).join('');
    observeBoards();
  }

  render();

  /* ── Live forhåndsvisning fra admin (styret-arkiv.html?preview=1) ── */
  if (IS_PREVIEW) {
    var pvNotify = function () { try { parent.postMessage({ type: 'apeiron-styret-arkiv-preview-height', height: document.documentElement.scrollHeight }, '*'); } catch (e) {} };
    window.addEventListener('message', function (e) {
      if (e.origin !== window.location.origin) return;
      var d = e.data;
      if (!d || d.type !== 'apeiron-styret-preview') return;
      if (d.content) window.STYRET_CONTENT = d.content;
      PREVIEW_IMAGES = d.images || {};
      render();
      document.querySelectorAll('.reveal').forEach(function (el) { el.classList.add('in'); });
      pvNotify();
    });
    document.querySelectorAll('.reveal').forEach(function (el) { el.classList.add('in'); });
    try { parent.postMessage({ type: 'apeiron-styret-arkiv-preview-ready' }, '*'); } catch (e) {}
  }
})();
</script>

(function () {
  var nav = document.getElementById('nav');
  if (nav) { function onScroll() { nav.classList.add('is-stuck'); } window.addEventListener('scroll', onScroll, { passive: true }); onScroll(); }
})();
</script>
