<style>
/* ── Ny student-side: kun denne sidens komponent-stil (resten arves fra styles.css) ── */

/* Hurtignav-kort i subhero (samme som Hjelp-siden) */
.help-nav{ display:grid; grid-template-columns:repeat(4, 1fr); gap:12px; margin-top:2.4em; max-width:840px; }
@media (max-width:700px){ .help-nav{ grid-template-columns:1fr 1fr; max-width:none; } }
.help-nav__card{ display:flex; flex-direction:column; gap:4px; background:rgba(244,236,217,.08);
  border:1px solid rgba(212,175,55,.3); border-radius:5px; padding:14px 16px; color:var(--on-dark);
  transition:transform .2s ease, background .2s ease, border-color .2s ease; }
.help-nav__card:hover{ transform:translateY(-3px); background:rgba(244,236,217,.14); border-color:var(--gold); }
.help-nav__card strong{ font-family:var(--display); font-size:1.12rem; font-weight:600; display:flex; align-items:center; gap:.4em; }
.help-nav__card strong::after{ content:"↓"; font-size:.9em; color:var(--gold); margin-left:auto; }
.help-nav__card span{ font-size:.82rem; line-height:1.45; color:rgba(244,236,217,.72); }

/* Mørkt bånd (Bli kjent) */
.ns-dark{ background:var(--navy); color:var(--on-dark); }
.ns-dark .h-section{ color:var(--on-dark); }
.ns-dark .lede{ color:rgba(244,236,217,.8); }
.ns-dark .eyebrow{ color:var(--gold); }

/* Nummerert sjekkliste */
.steps{ display:grid; grid-template-columns:1fr 1fr; gap:16px; }
@media (max-width:720px){ .steps{ grid-template-columns:1fr; } }
.step{ background:var(--card); border:1px solid var(--line); border-radius:8px; padding:24px 26px;
  box-shadow:0 1px 2px rgba(35,39,64,.05), 0 10px 26px -20px rgba(35,39,64,.5);
  display:grid; grid-template-columns:auto 1fr; gap:2px 18px; }
.step__n{ grid-row:1 / span 2; font-family:var(--display); font-weight:700; font-size:2.7rem;
  color:var(--gold-ink); line-height:.9; font-variant-numeric:tabular-nums; }
.step h3{ font-family:var(--display); font-weight:600; font-size:1.4rem; line-height:1.12;
  margin:0; align-self:center; color:var(--ink); }
.step p{ grid-column:2; margin:7px 0 0; color:var(--ink-soft); font-size:1rem; line-height:1.6; }

/* Velkomstkort på mørkt bånd */
.wgrid{ display:grid; grid-template-columns:repeat(auto-fit, minmax(205px,1fr)); gap:14px; }
.wcard{ background:rgba(244,236,217,.06); border:1px solid rgba(244,236,217,.14); border-radius:8px;
  padding:22px 22px 20px; display:flex; flex-direction:column; gap:8px; color:var(--on-dark);
  transition:transform .2s ease, border-color .2s ease; }
.wcard:hover{ transform:translateY(-3px); border-color:var(--gold); }
.wcard__ic{ font-size:1.5rem; line-height:1; }
.wcard h3{ font-family:var(--display); font-weight:600; font-size:1.4rem; margin:0; line-height:1.1; color:var(--on-dark); }
.wcard p{ margin:0; color:rgba(244,236,217,.75); font-size:.92rem; line-height:1.55; }
.wcard__go{ margin-top:auto; padding-top:8px; color:var(--gold); font-weight:600; font-size:.86rem; }
.wcard__go .arr{ display:inline-block; transition:transform .2s ease; }
.wcard:hover .wcard__go .arr{ transform:translateX(3px); }

/* Engasjer deg: bredt CTA-felt */
.engasjer{ margin-top:16px; background:rgba(244,236,217,.06); border:1px solid rgba(212,175,55,.4);
  border-radius:10px; padding:22px 26px; display:flex; align-items:center; justify-content:space-between;
  gap:22px; flex-wrap:wrap; }
.engasjer__txt{ display:flex; gap:16px; align-items:center; min-width:0; }
.engasjer__ic{ font-size:1.9rem; line-height:1; flex:0 0 auto; }
.engasjer h3{ font-family:var(--display); font-weight:600; font-size:1.6rem; margin:0; color:var(--on-dark); line-height:1.1; }
.engasjer p{ margin:4px 0 0; color:rgba(244,236,217,.75); font-size:.95rem; max-width:64ch; line-height:1.5; }

/* Stedskort på Dragvoll (ikon inline med tittel) */
.dgrid{ display:grid; grid-template-columns:repeat(3,1fr); gap:16px; }
@media (max-width:760px){ .dgrid{ grid-template-columns:1fr; } }
.dcard{ background:var(--card); border:1px solid var(--line); border-radius:8px; padding:22px 24px;
  box-shadow:0 1px 2px rgba(35,39,64,.05), 0 10px 26px -20px rgba(35,39,64,.5); }
.dcard__h{ display:flex; align-items:center; gap:12px; margin-bottom:8px; }
.dcard__ic{ font-size:1.3rem; line-height:1; flex:0 0 auto; }
.dcard h3{ font-family:var(--display); font-weight:600; font-size:1.4rem; margin:0; line-height:1.1; color:var(--ink); }
.dcard p{ margin:0; color:var(--ink-soft); font-size:.95rem; line-height:1.6; }
</style>

<script>
/* ── Render «Ny student?»-siden fra ny-student-content.js ── */
(function () {
  var IS_PREVIEW = false;
  try { IS_PREVIEW = /[?&]preview\b/.test(location.search); } catch (e) {}

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function setText(id, val) {
    var el = document.getElementById(id);
    if (!el) return;
    if (IS_PREVIEW) { el.textContent = (val == null ? '' : val); return; }
    if (val != null && val !== '') el.textContent = val;
  }

  function render() {
    var C = window.NYSTUDENT_CONTENT || {};

    /* Subhero */
    if (C.subhero) {
      var back = document.getElementById('hero-back');
      if (back) { if (C.subhero.back) back.textContent = C.subhero.back; if (C.subhero.backHref) back.href = C.subhero.backHref; }
      setText('hero-heading', C.subhero.heading);
      setText('hero-lede', C.subhero.lede);
      var navEl = document.getElementById('help-nav');
      if (navEl && Array.isArray(C.subhero.nav)) {
        navEl.innerHTML = C.subhero.nav.map(function (n) {
          return '<a class="help-nav__card" href="' + esc(n.target) + '">'
            + '<strong>' + esc(n.title) + '</strong>'
            + '<span>' + esc(n.desc) + '</span></a>';
        }).join('');
      }
    }

    /* Det praktiske (nummerert sjekkliste) */
    if (C.praktisk) {
      setText('praktisk-eyebrow', C.praktisk.eyebrow);
      setText('praktisk-heading', C.praktisk.heading);
      setText('praktisk-lede', C.praktisk.lede);
      var steps = document.getElementById('steps');
      if (steps && Array.isArray(C.praktisk.steps)) {
        steps.innerHTML = C.praktisk.steps.map(function (s, i) {
          return '<div class="step reveal"><span class="step__n">' + (i + 1) + '</span>'
            + '<h3>' + esc(s.title) + '</h3><p>' + esc(s.body) + '</p></div>';
        }).join('');
      }
    }

    /* Bli kjent (velkomstkort + engasjer-CTA) */
    if (C.blikjent) {
      setText('blikjent-eyebrow', C.blikjent.eyebrow);
      setText('blikjent-heading', C.blikjent.heading);
      setText('blikjent-lede', C.blikjent.lede);
      var wg = document.getElementById('wgrid');
      if (wg && Array.isArray(C.blikjent.cards)) {
        wg.innerHTML = C.blikjent.cards.map(function (c) {
          var go = c.linkLabel ? '<span class="wcard__go">' + esc(c.linkLabel) + ' <span class="arr">→</span></span>' : '';
          return '<a class="wcard reveal" href="' + esc(c.linkHref || '#') + '">'
            + '<span class="wcard__ic">' + esc(c.icon) + '</span>'
            + '<h3>' + esc(c.title) + '</h3><p>' + esc(c.body) + '</p>' + go + '</a>';
        }).join('');
      }
      var ew = document.getElementById('engasjer-wrap');
      var e = C.blikjent.engasjer;
      if (ew) {
        ew.innerHTML = e ? ('<div class="engasjer reveal"><div class="engasjer__txt">'
          + '<span class="engasjer__ic">' + esc(e.icon) + '</span>'
          + '<div><h3>' + esc(e.title) + '</h3><p>' + esc(e.body) + '</p></div></div>'
          + (e.ctaLabel ? '<a class="btn btn--gold" href="' + esc(e.ctaHref) + '">' + esc(e.ctaLabel) + ' <span class="arr">→</span></a>' : '')
          + '</div>') : '';
      }
    }

    /* På Dragvoll (stedskort) */
    if (C.dragvoll) {
      setText('dragvoll-eyebrow', C.dragvoll.eyebrow);
      setText('dragvoll-heading', C.dragvoll.heading);
      setText('dragvoll-lede', C.dragvoll.lede);
      var dg = document.getElementById('dgrid');
      if (dg && Array.isArray(C.dragvoll.cards)) {
        dg.innerHTML = C.dragvoll.cards.map(function (d) {
          return '<div class="dcard reveal"><div class="dcard__h">'
            + '<span class="dcard__ic">' + esc(d.icon) + '</span><h3>' + esc(d.title) + '</h3></div>'
            + '<p>' + esc(d.body) + '</p></div>';
        }).join('');
      }
    }

    /* Spørsmål (FAQ) */
    if (C.faq) {
      setText('faq-eyebrow', C.faq.eyebrow);
      setText('faq-heading', C.faq.heading);
      var fq = document.getElementById('faq-list');
      if (fq && Array.isArray(C.faq.items)) {
        fq.innerHTML = C.faq.items.map(function (f) {
          return '<div class="faq__item"><button class="faq__q">' + esc(f.q) + '</button>'
            + '<div class="faq__a"><p>' + esc(f.a) + '</p></div></div>';
        }).join('');
        wireFaq();
      }
    }

    applySectionOrder(C.sectionOrder);
  }

  /* Rekkefølge på innholdsseksjonene (settes i Admin -> Ny student).
     Subhero ligger fast øverst; bakgrunnene følger seksjonene (ingen auto-veksling). */
  function applySectionOrder(order) {
    var KEYS = ['praktisk', 'blikjent', 'dragvoll', 'faq'];
    var ord = (Array.isArray(order) ? order : []).filter(function (k) { return KEYS.indexOf(k) >= 0; });
    KEYS.forEach(function (k) { if (ord.indexOf(k) < 0) ord.push(k); });
    var els = ord.map(function (k) { return document.getElementById(k); }).filter(Boolean);
    if (els.length < 2) return;
    var parent = els[0].parentNode;
    if (!els.every(function (e) { return e.parentNode === parent; })) return;
    var kids = Array.prototype.slice.call(parent.children);
    var maxIdx = Math.max.apply(null, els.map(function (e) { return kids.indexOf(e); }));
    var endRef = kids[maxIdx + 1] || null;
    els.forEach(function (e) { parent.insertBefore(e, endRef); });
  }

  /* FAQ-accordion (samme oppførsel som js/app.js) */
  function wireFaq() {
    document.querySelectorAll('.faq__item').forEach(function (item) {
      var q = item.querySelector('.faq__q'); var a = item.querySelector('.faq__a');
      if (!q || q.dataset.wired) return; q.dataset.wired = '1';
      q.addEventListener('click', function () {
        var isOpen = item.classList.contains('open');
        document.querySelectorAll('.faq__item').forEach(function (it) {
          it.classList.remove('open'); var aa = it.querySelector('.faq__a'); if (aa) aa.style.maxHeight = null;
        });
        if (!isOpen) { item.classList.add('open'); a.style.maxHeight = a.scrollHeight + 'px'; }
      });
    });
  }

  /* Scroll-reveal */
  function observeReveals() {
    var reveals = Array.prototype.slice.call(document.querySelectorAll('.reveal:not(.in)'));
    if (!('IntersectionObserver' in window)) { reveals.forEach(function (el) { el.classList.add('in'); }); return; }
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (en) { if (en.isIntersecting) { en.target.classList.add('in'); io.unobserve(en.target); } });
    }, { threshold: 0.1 });
    reveals.forEach(function (el) { io.observe(el); });
  }

  render();
  observeReveals();

  /* ── Live forhåndsvisning fra admin (ny-student.html?preview=1) ── */
  if (IS_PREVIEW) {
    window.addEventListener('message', function (e) {
      if (e.origin !== window.location.origin) return;
      var d = e.data;
      if (!d || d.type !== 'apeiron-nystudent-preview') return;
      if (d.content) window.NYSTUDENT_CONTENT = d.content;
      render();
      document.querySelectorAll('.reveal').forEach(function (el) { el.classList.add('in'); });
      try { parent.postMessage({ type: 'apeiron-nystudent-preview-height', height: document.documentElement.scrollHeight }, '*'); } catch (ev) {}
    });
    document.querySelectorAll('.reveal').forEach(function (el) { el.classList.add('in'); });
    try { parent.postMessage({ type: 'apeiron-nystudent-preview-ready' }, '*'); } catch (ev) {}
  }
})();
</script>
