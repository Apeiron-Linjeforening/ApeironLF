<style>
/* Felles .subhero-stil ligger i styles.css — under: kun denne sidens avvik */

.subhero::after {
  content: ""; position: absolute; inset: 0; z-index: 0; pointer-events: none;
  background-image: radial-gradient(70% 50% at 50% -10%, rgba(212,175,55,.07), transparent 70%);
  opacity: .7;
}

/* ── Honor grid ── */
.honor-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
  gap: 24px;
  margin-top: 1.7em;
}
.honor-card {
  background: var(--card, #f7f3ec);
  border: 1px solid var(--line);
  border-top: 4px solid var(--c-l, var(--gold));
  border-radius: 5px;
  padding: 34px 28px 30px;
  display: flex; flex-direction: column; align-items: center; text-align: center; gap: 6px;
  transition: transform .22s ease, box-shadow .25s ease;
}
html[data-mode="marine"] .honor-card { border-top-color: var(--c-d, var(--gold)); }
.honor-card:hover { transform: translateY(-4px); box-shadow: 0 22px 44px -28px rgba(35,39,64,.5); }

.honor-card__ph {
  width: 132px; height: 132px; border-radius: 50%; overflow: hidden;
  border: 3px solid var(--c-l, var(--gold)); background: var(--navy);
  position: relative; margin-bottom: 12px;
}
html[data-mode="marine"] .honor-card__ph { border-color: var(--c-d, var(--gold)); }
.honor-card__ph image-slot { width: 100%; height: 100%; }
.honor-card__ph image-slot::part(empty) { opacity: 0; }
.honor-card__ph image-slot:not([data-editable]) { pointer-events: none; cursor: default; }
.honor-card__initials {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  font-family: var(--display); font-size: 2.2rem; font-weight: 600; color: var(--gold);
  letter-spacing: .03em; pointer-events: none;
}
.honor-card__ph:has(image-slot[data-filled]) .honor-card__initials { display: none; }

.honor-card__year {
  font-family: var(--body); font-size: .68rem; font-weight: 700;
  letter-spacing: .26em; text-transform: uppercase; color: var(--accent-ink, var(--gold-ink));
}
.honor-card h3 { font-family: var(--display); font-size: 1.6rem; font-weight: 600; color: var(--ink); line-height: 1.08; margin: 0; }
.honor-card__honor {
  font-family: var(--display); font-style: italic; font-size: 1.12rem;
  color: var(--c-l, var(--warm)); margin: 2px 0 8px;
}
html[data-mode="marine"] .honor-card__honor { color: var(--c-d, var(--gold)); }
.honor-card__honor::before,
.honor-card__honor::after { content: "·"; opacity: .5; margin: 0 .5em; }
.honor-card p { font-size: .95rem; color: var(--ink-soft, #4a4d6a); line-height: 1.6; margin: 0; }

.honor-empty {
  grid-column: 1 / -1; text-align: center; padding: 60px 20px;
  color: var(--ink-soft); font-style: italic; font-size: 1.05rem;
}

/* ── Årskull-filter ── */
.honor-filter {
  display: flex; flex-direction: column; align-items: center; gap: 13px;
  margin: -8px 0 6px;
}
.honor-filter[hidden] { display: none; }
.honor-filter__label {
  font-family: var(--body); font-size: .7rem; font-weight: 700;
  letter-spacing: .24em; text-transform: uppercase; color: var(--accent-ink, var(--gold-ink));
}
.honor-filter__chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
.honor-chip {
  font-family: var(--body); font-size: .84rem; font-weight: 600; letter-spacing: .03em;
  padding: .5em 1.15em; border-radius: 999px; cursor: pointer; color: var(--ink-soft);
  background: transparent; border: 1px solid var(--line);
  transition: color .18s, background .18s, border-color .18s, transform .18s;
}
.honor-chip:hover { color: var(--ink); border-color: var(--ink); transform: translateY(-1px); }
.honor-chip.is-active { background: var(--navy); color: var(--paper); border-color: var(--navy); }
html[data-mode="marine"] .honor-chip.is-active { background: var(--gold); color: var(--navy); border-color: var(--gold); }

@media (max-width: 600px) { .honor-grid { grid-template-columns: 1fr; } }

<script>
/* ── Render utmerkelser fra utmerkelser-content.js ── */
(function () {
  var IS_PREVIEW = false;
  try { IS_PREVIEW = /[?&]preview\b/.test(location.search); } catch (e) {}
  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function setText(id, val) {
    var el = document.getElementById(id);
    if (!el) return;
    if (IS_PREVIEW) { el.textContent = (val == null ? '' : val); return; }
    if (val != null && val !== '') el.textContent = val;
  }
  var STAGGER = ['', 'd1', 'd2', 'd3'];
  var currentFilter = 'all';

  // Sorteringsnøkkel: første firesifrede årstall i strengen (årskull «2024/2025» → 2024).
  function yearKey(y) { var m = String(y == null ? '' : y).match(/\d{4}/); return m ? parseInt(m[0], 10) : -1; }

  // Distinkte årskull, nyeste først.
  function distinctYears(people) {
    var seen = {}, out = [];
    people.forEach(function (p) {
      var y = String((p && p.year) || '').trim();
      if (y && !seen[y]) { seen[y] = 1; out.push(y); }
    });
    out.sort(function (a, b) { return yearKey(b) - yearKey(a); });
    return out;
  }

  // Stabil sortering etter årskull (nyeste først), beholder admin-rekkefølge innen samme kull.
  function sortByYear(people) {
    return people.map(function (p, i) { return { p: p, i: i }; })
      .sort(function (a, b) { var d = yearKey(b.p.year) - yearKey(a.p.year); return d !== 0 ? d : a.i - b.i; })
      .map(function (o) { return o.p; });
  }

  var revealIO = ('IntersectionObserver' in window) ? new IntersectionObserver(function (entries) {
    entries.forEach(function (e) { if (e.isIntersecting) { e.target.classList.add('in'); revealIO.unobserve(e.target); } });
  }, { threshold: 0.1 }) : null;
  function observeGrid() {
    var cards = document.querySelectorAll('#honor-grid .reveal');
    if (!revealIO || IS_PREVIEW) { cards.forEach(function (c) { c.classList.add('in'); }); return; }
    cards.forEach(function (c) { if (!c.classList.contains('in')) revealIO.observe(c); });
  }

  function renderFilter(years) {
    var fhost = document.getElementById('honor-filter');
    if (!fhost) return;
    if (years.length < 2) { fhost.innerHTML = ''; fhost.hidden = true; currentFilter = 'all'; return; }
    if (currentFilter !== 'all' && years.indexOf(currentFilter) < 0) currentFilter = 'all';
    fhost.hidden = false;
    var chips = ['all'].concat(years).map(function (y) {
      var label = (y === 'all') ? 'Alle' : y;
      var active = (currentFilter === y) ? ' is-active' : '';
      return '<button type="button" class="honor-chip' + active + '" data-year="' + esc(y) + '">' + esc(label) + '</button>';
    }).join('');
    fhost.innerHTML = '<span class="honor-filter__label">Vis årskull</span><div class="honor-filter__chips">' + chips + '</div>';
    fhost.querySelectorAll('.honor-chip').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var y = btn.getAttribute('data-year');
        if (y === currentFilter) return;
        currentFilter = y;
        renderUtmerkelser();
      });
    });
  }

  function renderUtmerkelser() {
    var C = window.UTMERKELSER_CONTENT || {};
    if (C.intro) {
      setText('intro-eyebrow', C.intro.eyebrow);
      setText('intro-heading', C.intro.heading);
      setText('intro-lede', C.intro.lede);
      var bk = document.getElementById('intro-back');
      if (bk) {
        if (IS_PREVIEW) bk.textContent = (C.intro.back == null ? '' : C.intro.back);
        else if (C.intro.back) bk.textContent = C.intro.back;
        if (C.intro.backHref) bk.setAttribute('href', C.intro.backHref);
      }
    }
    var grid = document.getElementById('honor-grid');
    if (!grid || !Array.isArray(C.people)) return;
    var people = C.people.slice();
    var years = distinctYears(people);
    renderFilter(years);
    if (!people.length) {
      grid.innerHTML = '<p class="honor-empty">Ingen utmerkelser er lagt til ennå.</p>';
      return;
    }
    var list = sortByYear(people);
    if (currentFilter !== 'all') list = list.filter(function (p) { return String((p.year || '')).trim() === currentFilter; });
    if (!list.length) {
      grid.innerHTML = '<p class="honor-empty">Ingen utmerkelser i dette årskullet ennå.</p>';
      return;
    }
    var sv = window.paletteStyleVars || function () { return ''; };
    grid.innerHTML = list.map(function (p, i) {
      var accentStyle = p.accent ? sv(p.accent) : '';
      var honor = p.honor ? '<div class="honor-card__honor">' + esc(p.honor) + '</div>' : '';
      var year = p.year ? '<div class="honor-card__year">' + esc(p.year) + '</div>' : '';
      var desc = p.desc ? '<p>' + esc(p.desc) + '</p>' : '';
      return '<div class="honor-card reveal ' + STAGGER[i % 4] + '" style="' + accentStyle + '">'
        + '<div class="honor-card__ph"><span class="honor-card__initials">' + esc(p.initials) + '</span>'
        + '<image-slot id="honor-photo-' + i + '" shape="circle" placeholder="Foto" src="' + esc(p.img || '') + '"></image-slot></div>'
        + year
        + '<h3>' + esc(p.name) + '</h3>'
        + honor
        + desc
        + '</div>';
    }).join('');
    observeGrid();
  }

  renderUtmerkelser();

  /* ── Live forhåndsvisning fra admin (utmerkelser.html?preview=1) ── */
  if (IS_PREVIEW) {
    var pvNotify = function () {
      try { parent.postMessage({ type: 'apeiron-utmerkelser-preview-height', height: document.documentElement.scrollHeight }, '*'); } catch (e) {}
    };
    window.addEventListener('message', function (e) {
      if (e.origin !== window.location.origin) return;
      var d = e.data;
      if (!d || d.type !== 'apeiron-utmerkelser-preview') return;
      if (d.content) window.UTMERKELSER_CONTENT = d.content;
      renderUtmerkelser();
      document.querySelectorAll('.reveal').forEach(function (el) { el.classList.add('in'); });
      pvNotify();
    });
    document.querySelectorAll('.reveal').forEach(function (el) { el.classList.add('in'); });
    try { parent.postMessage({ type: 'apeiron-utmerkelser-preview-ready' }, '*'); } catch (e) {}
  }
})();
</script>
<script>
(function () {
  var reveals = document.querySelectorAll('.reveal');
  if ('IntersectionObserver' in window) {
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (e) {
        if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); }
      });
    }, { threshold: 0.1 });
    reveals.forEach(function (el) { io.observe(el); });
  } else {
    reveals.forEach(function (el) { el.classList.add('in'); });
  }
})();
</script>
